# Types, tests, Claude Code's own validation of the marketplace and plugin, and
# the npm tarball's check, on every PR and on main.
#
# Publishing is not here: that is release.yml, on a `v*` tag a person cuts on
# main (CONTRIBUTING.md → Releasing).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The token stays out of .git/config, where every later step (npm
          # install scripts included) could read it. Nothing here pushes.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Install gitleaks and the Claude Code CLI
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          npm install --global @anthropic-ai/claude-code

      - name: Validate marketplace and plugin
        run: npm run validate

      # The npm tarball the release would publish, packed and checked the same
      # way, so a change that breaks it fails here rather than at a tag.
      - name: Pack check
        run: npm run pack:check

      # Third-party, so pinned to a commit: a tag can be moved. The token is
      # what it lists a pull request's commits with (read-only here).
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
