# Types, tests and Claude Code's own validation of the marketplace and plugin,
# on every PR and on main.
#
# There is no publish step: the marketplace serves this repository, and a
# release is a person cutting a `v*` tag on main (CONTRIBUTING.md → Releasing).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Validate marketplace and plugin
        run: |
          npm install --global @anthropic-ai/claude-code
          npm run validate

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
